name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-platforms.yml'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'models/**'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Isolate app settings
        run: |
          echo "PQO_APP_DATA_ROOT=$RUNNER_TEMP/pqo-data" >> "$GITHUB_ENV"
          echo "PQO_SETTINGS_FILE=$RUNNER_TEMP/pqo-settings.ini" >> "$GITHUB_ENV"
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0t64 libegl1 libgl1 libfontconfig1 fonts-dejavu-core libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          python -m pip install 'torch>=2.10,<2.11' --index-url https://download.pytorch.org/whl/cpu
      - name: macOS runtime libraries
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install dependencies
        timeout-minutes: 12
        run: python -m pip install -e '.[desktop,build,dev]' 'scikit-learn==1.9.0'
      - name: Linux tests
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: python -m pytest -p no:cacheprovider -o faulthandler_timeout=90
      - name: macOS core tests
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          python -m pytest -p no:cacheprovider -o faulthandler_timeout=60 \
            tests/test_sql_features.py tests/test_prediction.py tests/test_sql_rewrite.py \
            tests/test_transaction_context.py tests/test_transaction_replay.py \
            tests/test_transaction_select_rewrite.py tests/test_transaction_load.py \
            tests/test_transaction_roles_and_calls.py
      - name: Freeze desktop
        run: python -m PyInstaller --noconfirm --clean packaging/PredictiveQueryOptimization.spec
      - name: Linux smoke and archive
        if: runner.os == 'Linux'
        run: |
          dist/PredictiveQueryOptimization/PredictiveQueryOptimization --smoke-test
          tar -C dist -czf "dist/PQO-Linux-$(uname -m).tar.gz" PredictiveQueryOptimization
      - name: macOS smoke and archive
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          dist/PredictiveQueryOptimization.app/Contents/MacOS/PredictiveQueryOptimization --smoke-test
          ditto -c -k --keepParent dist/PredictiveQueryOptimization.app "dist/PQO-macOS-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pqo-${{ matrix.os }}
          path: |
            dist/PQO-*.tar.gz
            dist/PQO-*.zip
          if-no-files-found: error
