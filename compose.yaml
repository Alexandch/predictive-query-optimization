services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-query_optimizer}
      POSTGRES_USER: ${POSTGRES_USER:-query_optimizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-query_optimizer}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-query_optimizer} -d ${POSTGRES_DB:-query_optimizer}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
