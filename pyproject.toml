[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-query-optimization"
version = "0.1.6"
description = "PostgreSQL query-time prediction and index recommendation system"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "sqlglot>=30.18,<31",
]

[project.optional-dependencies]
ml = [
    "joblib>=1.6,<2",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "xgboost>=3.4,<4",
]
rl = [
    "torch>=2.10,<3",
]
desktop = [
    "joblib>=1.6,<2",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "xgboost>=3.4,<4",
    "torch>=2.10,<3",
    "PyQt6>=6.7,<7",
]
build = [
    "pyinstaller>=6.11,<7",
    "pillow>=11,<13",
]
dev = [
    "pytest>=8.3,<9",
    "joblib>=1.6,<2",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "xgboost>=3.4,<4",
    "torch>=2.10,<3",
    "PyQt6>=6.7,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pqo-collect = "pqo.cli:main"
pqo-generate = "pqo.generate_cli:main"
pqo-train = "pqo.train_cli:main"
pqo-predict = "pqo.predict_cli:main"
pqo-export = "pqo.export_cli:main"
pqo-index = "pqo.index_cli:main"
pqo-dqn-collect = "pqo.dqn_collect_cli:main"
pqo-dqn-train = "pqo.dqn_train_cli:main"
pqo-recommend = "pqo.recommend_cli:main"
pqo-merge = "pqo.merge_cli:main"
pqo-merge-dqn = "pqo.merge_dqn_cli:main"
pqo-analyze = "pqo.analyze_cli:main"
pqo-calibrate = "pqo.calibrate_cli:main"
pqo-desktop = "pqo.desktop:main"
pqo-production-benchmark = "pqo.production_benchmark_cli:main"
pqo-retail = "pqo.retail_cli:main"
pqo-retail-control = "pqo.retail_control_cli:main"
pqo-logistics-control = "pqo.logistics_control_cli:main"
pqo-dqn-negative = "pqo.dqn_negative_cli:main"
pqo-chbenchmark = "pqo.chbenchmark_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
